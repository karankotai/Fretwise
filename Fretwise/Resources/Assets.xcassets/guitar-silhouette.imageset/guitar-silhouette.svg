<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" fill="#FFFFFF">
  <!-- Headstock -->
  <rect x="88" y="0" width="24" height="55" rx="4"/>
  <!-- Tuning pegs left -->
  <circle cx="80" cy="12" r="5"/>
  <circle cx="80" cy="28" r="5"/>
  <circle cx="80" cy="44" r="5"/>
  <!-- Tuning pegs right -->
  <circle cx="120" cy="12" r="5"/>
  <circle cx="120" cy="28" r="5"/>
  <circle cx="120" cy="44" r="5"/>
  <!-- Neck -->
  <rect x="91" y="55" width="18" height="185" rx="1"/>
  <!-- Upper bout -->
  <ellipse cx="100" cy="288" rx="52" ry="48"/>
  <!-- Waist (cut-in) - use overlay to create waist shape -->
  <ellipse cx="100" cy="338" rx="38" ry="28" fill="black"/>
  <ellipse cx="100" cy="338" rx="40" ry="30"/>
  <!-- Lower bout -->
  <ellipse cx="100" cy="408" rx="70" ry="68"/>
  <!-- Sound hole -->
  <circle cx="100" cy="338" r="22" fill="black"/>
  <circle cx="100" cy="338" r="25" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Bridge -->
  <rect x="82" y="425" width="36" height="5" rx="2"/>
  <!-- Strings on body -->
  <line x1="94" y1="240" x2="94" y2="425" stroke="black" stroke-width="0.5"/>
  <line x1="97" y1="240" x2="97" y2="425" stroke="black" stroke-width="0.5"/>
  <line x1="100" y1="240" x2="100" y2="425" stroke="black" stroke-width="0.5"/>
  <line x1="103" y1="240" x2="103" y2="425" stroke="black" stroke-width="0.5"/>
  <line x1="106" y1="240" x2="106" y2="425" stroke="black" stroke-width="0.5"/>
</svg>
