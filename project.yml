name: Fretwise
options:
  bundleIdPrefix: com.karankotai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Fretwise:
    type: application
    platform: iOS
    sources:
      - path: Fretwise
        resources:
          - path: Resources/Lessons
            buildPhase: resources
    settings:
      base:
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Fretwise listens to your guitar to detect chords and give real-time feedback as you practice."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.karankotai.Fretwise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Fretwise/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Fretwise listens to your guitar to detect chords and give real-time feedback as you practice."

  FretwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FretwiseTests
    dependencies:
      - target: Fretwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karankotai.FretwiseTests
